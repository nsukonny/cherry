<article class="post-card">
	<a class="post-card__cover" href="article.html" tabindex="-1" aria-hidden="true">
		<span class="post-card__plate post-card__plate--@@tone">
			@@include('partials/icons/cherry.html', {"class": "post-card__icon", "stroke": "1.4"})
		</span>
	</a>
	<span class="post-card__cats">@@cats</span>
	<h3 class="post-card__title">
		<a class="post-card__title-link" href="article.html">@@title</a>
	</h3>
	<p class="post-card__text">@@text</p>
	<div class="post-card__meta">
		<time datetime="@@datetime">@@date</time>
		<span class="post-card__views">
			@@include('partials/icons/eye.html', {"class": "post-card__views-icon"})
			<span class="visually-hidden">Просмотров:</span> @@views
		</span>
	</div>
	<a class="button button--block" href="article.html" aria-label="Читать статью: @@title">Читать статью</a>
</article>
